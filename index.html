<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" />
  <meta name="description" content="太子伴读 —— 一个安静的书写角落，写下此刻的一点点。" />
  <title>太子伴读 · 写下此刻的一点点</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233B5BFE'/%3E%3Cpath d='M19 4.2c-4.4.3-8.6 2.4-10.8 5.1-1.3 1.6-2 3.6-2.3 5.6-.1.7.5 1.2 1.2 1 2.1-.5 4.2-1.3 5.8-2.7C15.6 11 17.9 7.4 19 4.2Z' fill='%23fff'/%3E%3C/svg%3E" />

  <style>
    /* ==================================================================
       1. 设计令牌（Design Tokens）
       —— 颜色 / 圆角 / 阴影 / 动效曲线集中在此，全站统一引用
       ================================================================== */
    :root {
      /* 主色 */
      --primary: #3B5BFE;
      --primary-strong: #2647D8;
      --primary-soft: #EEF1FF;

      /* 背景与表面 */
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --surface-alt: #F2F4F8;

      /* 文字 */
      --text: #0F172A;
      --text-muted: #475569;
      --text-faint: #94A3B8;

      /* 功能色 */
      --danger: #EF4444;
      --warn: #F59E0B;
      --success: #10B981;
      --border: #E5E8EF;

      /* 形状 */
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;

      /* 阴影（柔和、低对比） */
      --shadow-card: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px -18px rgba(15, 23, 42, .28);
      --shadow-card-hover: 0 2px 6px rgba(15, 23, 42, .05), 0 18px 36px -20px rgba(15, 23, 42, .34);

      /* 动效 */
      --ease: cubic-bezier(.22, 1, .36, 1);
      --dur-fast: 160ms;
      --dur-base: 220ms;

      /* 字体：系统字体栈，零外部依赖 */
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    /* ==================================================================
       2. 基础重置与页面骨架
       ================================================================== */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      background-color: var(--bg);
      /* 顶部一层极淡的主色光晕，让浅色背景不至于平铺乏味 */
      background-image: radial-gradient(760px 320px at 50% -140px, #E9EDFF 0%, rgba(233, 237, 255, 0) 72%);
      background-repeat: no-repeat;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 单列居中容器：桌面 600px，移动端自适应 */
    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ==================================================================
       3. 品牌栏
       ================================================================== */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .brand__logo {
      display: grid;
      place-items: center;
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #5A74FF 0%, var(--primary) 45%, #2C49D6 100%);
      box-shadow: 0 8px 18px -10px rgba(59, 91, 254, .9);
    }

    .brand__title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .3px;
      line-height: 1.25;
    }

    .brand__tagline {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--text-faint);
      line-height: 1.4;
    }

    /* ==================================================================
       4. 卡片通用样式
       ================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--dur-base) var(--ease),
                  border-color var(--dur-base) var(--ease),
                  transform var(--dur-fast) var(--ease);
    }

    /* ==================================================================
       5. 发布卡片（Composer）
       ================================================================== */
    .composer {
      display: flex;
      gap: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    /* 聚焦时整张卡片描边与阴影联动，形成"正在书写"的聚焦感 */
    .composer:focus-within {
      border-color: rgba(59, 91, 254, .55);
      box-shadow: 0 2px 6px rgba(59, 91, 254, .06), 0 20px 40px -22px rgba(59, 91, 254, .55);
    }

    .avatar {
      display: grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      user-select: none;
      background: linear-gradient(145deg, #8FA2FF 0%, #5C77FF 55%, #3B5BFE 100%);
    }

    .composer__body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .composer__input {
      display: block;
      width: 100%;
      min-height: 84px;
      max-height: 260px;
      padding: 4px 0 8px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px; /* 16px 可避免 iOS Safari 聚焦时自动放大页面 */
      line-height: 1.65;
      color: var(--text);
    }

    .composer__input::placeholder { color: var(--text-faint); }

    .composer__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--surface-alt);
    }

    .composer__counter {
      font-size: 13px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      transition: color var(--dur-fast) var(--ease);
    }

    /* 剩余字数进入告警区 / 已超出 */
    .composer__counter[data-state="warn"] { color: var(--warn); }
    .composer__counter[data-state="over"] { color: var(--danger); font-weight: 600; }

    /* ==================================================================
       6. 按钮
       ================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 22px;
      border: 0;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .2px;
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease),
                  color var(--dur-fast) var(--ease),
                  transform var(--dur-fast) var(--ease),
                  box-shadow var(--dur-fast) var(--ease);
    }

    .btn--primary {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 18px -10px rgba(59, 91, 254, .95);
    }

    .btn--primary:hover:not(:disabled) {
      background: var(--primary-strong);
      transform: translateY(-1px);
      box-shadow: 0 12px 22px -10px rgba(38, 71, 216, .95);
    }

    .btn--primary:active:not(:disabled) { transform: translateY(0); }

    .btn:disabled {
      color: var(--text-faint);
      background: var(--surface-alt);
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ==================================================================
       7. 信息流容器
       ================================================================== */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* ==================================================================
       8. 页脚
       ================================================================== */
    .page-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- 品牌栏 -->
    <header class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none">
          <path d="M19 4.2c-4.4.3-8.6 2.4-10.8 5.1-1.3 1.6-2 3.6-2.3 5.6-.1.7.5 1.2 1.2 1 2.1-.5 4.2-1.3 5.8-2.7C15.6 11 17.9 7.4 19 4.2Z"
                fill="currentColor" opacity=".95" />
          <path d="M5.2 19.6c1.1-3.3 2.9-5.8 5.5-7.6"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </span>
      <div class="brand__text">
        <h1 class="brand__title">太子伴读</h1>
        <p class="brand__tagline">写下此刻的一点点</p>
      </div>
    </header>

    <main>
      <!-- 发布区 -->
      <section class="card composer" aria-label="发布新的片语">
        <span class="avatar" aria-hidden="true">伴</span>

        <form class="composer__body" id="composer-form" novalidate>
          <label class="visually-hidden" for="composer-input">写下此刻的想法</label>
          <textarea
            id="composer-input"
            class="composer__input"
            name="content"
            rows="3"
            placeholder="此刻在想什么？"
            aria-describedby="char-counter"></textarea>

          <div class="composer__footer">
            <span class="composer__counter" id="char-counter" aria-live="polite">还可输入 140 字</span>
            <button type="submit" class="btn btn--primary" id="publish-btn" disabled>发布</button>
          </div>
        </form>
      </section>

      <!-- 时间线 -->
      <section aria-label="片语时间线">
        <ul class="timeline" id="timeline"></ul>
      </section>
    </main>

    <footer class="page-footer">
      <p>内容仅保存在此浏览器 · 太子伴读</p>
    </footer>
  </div>
</body>
</html>
