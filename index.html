<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F8FA" />
  <meta name="description" content="太子伴读 —— 一个安静的书写角落，写下此刻的一点点。" />
  <title>太子伴读 · 写下此刻的一点点</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233B5BFE'/%3E%3Cpath d='M19 4.2c-4.4.3-8.6 2.4-10.8 5.1-1.3 1.6-2 3.6-2.3 5.6-.1.7.5 1.2 1.2 1 2.1-.5 4.2-1.3 5.8-2.7C15.6 11 17.9 7.4 19 4.2Z' fill='%23fff'/%3E%3C/svg%3E" />

  <style>
    /* ==================================================================
       1. 设计令牌（Design Tokens）
       —— 颜色 / 圆角 / 阴影 / 动效曲线集中在此，全站统一引用
       ================================================================== */
    :root {
      /* 主色 */
      --primary: #3B5BFE;
      --primary-strong: #2647D8;
      --primary-soft: #EEF1FF;

      /* 背景与表面 */
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --surface-alt: #F2F4F8;

      /* 文字 */
      --text: #0F172A;
      --text-muted: #475569;
      --text-faint: #94A3B8;

      /* 功能色 */
      --danger: #EF4444;
      --warn: #F59E0B;
      --success: #10B981;
      --border: #E5E8EF;

      /* 形状 */
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;

      /* 阴影（柔和、低对比） */
      --shadow-card: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px -18px rgba(15, 23, 42, .28);
      --shadow-card-hover: 0 2px 6px rgba(15, 23, 42, .05), 0 18px 36px -20px rgba(15, 23, 42, .34);

      /* 动效 */
      --ease: cubic-bezier(.22, 1, .36, 1);
      --dur-fast: 160ms;
      --dur-base: 220ms;

      /* 字体：系统字体栈，零外部依赖 */
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    /* ==================================================================
       2. 基础重置与页面骨架
       ================================================================== */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      background-color: var(--bg);
      /* 顶部一层极淡的主色光晕，让浅色背景不至于平铺乏味 */
      background-image: radial-gradient(760px 320px at 50% -140px, #E9EDFF 0%, rgba(233, 237, 255, 0) 72%);
      background-repeat: no-repeat;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 单列居中容器：桌面 600px，移动端自适应 */
    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ==================================================================
       3. 品牌栏
       ================================================================== */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .brand__logo {
      display: grid;
      place-items: center;
      flex: none;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #5A74FF 0%, var(--primary) 45%, #2C49D6 100%);
      box-shadow: 0 8px 18px -10px rgba(59, 91, 254, .9);
    }

    .brand__title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .3px;
      line-height: 1.25;
    }

    .brand__tagline {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--text-faint);
      line-height: 1.4;
    }

    /* ==================================================================
       4. 卡片通用样式
       ================================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--dur-base) var(--ease),
                  border-color var(--dur-base) var(--ease),
                  transform var(--dur-fast) var(--ease);
    }

    /* ==================================================================
       5. 发布卡片（Composer）
       ================================================================== */
    .composer {
      display: flex;
      gap: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    /* 聚焦时整张卡片描边与阴影联动，形成"正在书写"的聚焦感 */
    .composer:focus-within {
      border-color: rgba(59, 91, 254, .55);
      box-shadow: 0 2px 6px rgba(59, 91, 254, .06), 0 20px 40px -22px rgba(59, 91, 254, .55);
    }

    .avatar {
      display: grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      user-select: none;
      background: linear-gradient(145deg, #8FA2FF 0%, #5C77FF 55%, #3B5BFE 100%);
    }

    .composer__body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .composer__input {
      display: block;
      width: 100%;
      min-height: 84px;
      max-height: 260px;
      padding: 4px 0 8px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font-family: inherit;
      font-size: 16px; /* 16px 可避免 iOS Safari 聚焦时自动放大页面 */
      line-height: 1.65;
      color: var(--text);
    }

    .composer__input::placeholder { color: var(--text-faint); }

    .composer__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--surface-alt);
    }

    .composer__counter {
      font-size: 13px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      transition: color var(--dur-fast) var(--ease);
    }

    /* 剩余字数进入告警区 / 已超出 */
    .composer__counter[data-state="warn"] { color: var(--warn); }
    .composer__counter[data-state="over"] { color: var(--danger); font-weight: 600; }

    /* ==================================================================
       6. 按钮
       ================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 22px;
      border: 0;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .2px;
      cursor: pointer;
      transition: background-color var(--dur-fast) var(--ease),
                  color var(--dur-fast) var(--ease),
                  transform var(--dur-fast) var(--ease),
                  box-shadow var(--dur-fast) var(--ease);
    }

    .btn--primary {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 18px -10px rgba(59, 91, 254, .95);
    }

    .btn--primary:hover:not(:disabled) {
      background: var(--primary-strong);
      transform: translateY(-1px);
      box-shadow: 0 12px 22px -10px rgba(38, 71, 216, .95);
    }

    .btn--primary:active:not(:disabled) { transform: translateY(0); }

    .btn:disabled {
      color: var(--text-faint);
      background: var(--surface-alt);
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ==================================================================
       7. 信息流容器
       ================================================================== */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* 作者样式优先级高于 UA 的 [hidden]，需显式声明才生效 */
    .timeline[hidden] { display: none; }

    /* ==================================================================
       8. 信息流卡片（Post）
       ================================================================== */
    .post {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
    }

    .post__main {
      flex: 1 1 auto;
      min-width: 0; /* 允许长串字符换行，不撑破卡片 */
    }

    .post__head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      line-height: 1.5;
    }

    .post__author {
      font-weight: 600;
      color: var(--text);
    }

    .post__dot { color: var(--text-faint); }

    .post__time {
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }

    .post__body {
      margin: 6px 0 0;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-muted);
      /* 保留用户输入中的换行，同时允许超长单词/链接折行 */
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* 卡片右上角的删除入口：默认低透明度，悬停卡片时浮现 */
    .post__delete {
      margin-left: auto;
      opacity: .4;
      transition: opacity var(--dur-fast) var(--ease),
                  color var(--dur-fast) var(--ease),
                  background-color var(--dur-fast) var(--ease);
    }

    .post:hover .post__delete,
    .post:focus-within .post__delete { opacity: 1; }

    /* 通用图标按钮 */
    .icon-btn {
      display: grid;
      place-items: center;
      flex: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--text-faint);
      background: transparent;
      cursor: pointer;
      transition: color var(--dur-fast) var(--ease),
                  background-color var(--dur-fast) var(--ease);
    }

    .icon-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, .09);
    }

    .icon-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ==================================================================
       9. 空状态
       ================================================================== */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 36px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }

    .empty[hidden] { display: none; }

    .empty__art {
      width: 160px;
      height: 120px;
      opacity: .95;
    }

    .empty__title {
      margin: 12px 0 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .empty__desc {
      margin: 6px 0 0;
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-faint);
    }

    /* ==================================================================
       10. 删除确认弹窗
       ================================================================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .modal[hidden] { display: none; }

    .modal__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      animation: backdropIn var(--dur-base) var(--ease);
    }

    .modal__panel {
      position: relative;
      width: min(320px, 100%);
      padding: 22px;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 28px 64px -22px rgba(15, 23, 42, .5);
      animation: modalIn var(--dur-base) var(--ease);
    }

    .modal__title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .modal__desc {
      margin: 8px 0 0;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-muted);
    }

    .modal__actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn--ghost {
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .btn--ghost:hover {
      color: var(--text);
      background: var(--surface-alt);
    }

    .btn--danger {
      color: #fff;
      background: var(--danger);
      box-shadow: 0 8px 18px -10px rgba(239, 68, 68, .9);
    }

    .btn--danger:hover {
      background: #DC2626;
      transform: translateY(-1px);
    }

    /* 弹窗打开时锁定页面滚动 */
    body.is-modal-open { overflow: hidden; }

    @keyframes backdropIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ==================================================================
       11. 页脚
       ================================================================== */
    .page-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
    }

    /* ==================================================================
       12. 悬停、入场与状态微动效
       ================================================================== */
    .post:hover,
    .post:focus-within {
      transform: translateY(-1px);
      border-color: #DCE2F0;
      box-shadow: var(--shadow-card-hover);
    }

    /* 离场态需压过 hover 的 transform，故写在 hover 之后 */
    .post.is-leaving {
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 200ms var(--ease), transform 200ms var(--ease);
    }

    /* 新发布的卡片：淡入 + 轻微上移 */
    .post.is-entering { animation: fadeSlideIn 320ms var(--ease) both; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 发布按钮的加载指示 */
    .btn__spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .45);
      border-top-color: #fff;
      border-radius: 50%;
    }

    .btn.is-loading { pointer-events: none; }

    .btn.is-loading .btn__spinner {
      display: block;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 字数超限时抖动一次，强化"无法发布"的反馈 */
    .composer__counter.is-shake { animation: shake 320ms var(--ease); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-2px); }
    }

    /* ==================================================================
       13. 轻提示（Toast）
       ================================================================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 90;
      max-width: calc(100% - 32px);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      color: #fff;
      background: rgba(15, 23, 42, .92);
      box-shadow: 0 12px 30px -12px rgba(15, 23, 42, .6);
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
      transition: opacity var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
      pointer-events: none;
    }

    .toast[hidden] { display: none; }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==================================================================
       14. 响应式：移动端收窄留白、按钮整行
       ================================================================== */
    @media (max-width: 639px) {
      .app { padding: 20px 12px 36px; }

      .brand { margin-bottom: 14px; }
      .brand__title { font-size: 20px; }
      .brand__logo { width: 38px; height: 38px; border-radius: 12px; }

      .composer,
      .post { padding: 14px; border-radius: 14px; }

      .composer__footer {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .btn--primary { width: 100%; }

      /* 触屏没有 hover，删除入口保持常显可点 */
      .post__delete { opacity: .55; }

      .empty { padding: 30px 18px 28px; border-radius: 14px; }
    }

    /* ==================================================================
       15. 尊重系统「减少动态效果」偏好
       ================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- 品牌栏 -->
    <header class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none">
          <path d="M19 4.2c-4.4.3-8.6 2.4-10.8 5.1-1.3 1.6-2 3.6-2.3 5.6-.1.7.5 1.2 1.2 1 2.1-.5 4.2-1.3 5.8-2.7C15.6 11 17.9 7.4 19 4.2Z"
                fill="currentColor" opacity=".95" />
          <path d="M5.2 19.6c1.1-3.3 2.9-5.8 5.5-7.6"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </span>
      <div class="brand__text">
        <h1 class="brand__title">太子伴读</h1>
        <p class="brand__tagline">写下此刻的一点点</p>
      </div>
    </header>

    <main>
      <!-- 发布区 -->
      <section class="card composer" aria-label="发布新的片语">
        <span class="avatar" aria-hidden="true">伴</span>

        <form class="composer__body" id="composer-form" novalidate>
          <label class="visually-hidden" for="composer-input">写下此刻的想法</label>
          <textarea
            id="composer-input"
            class="composer__input"
            name="content"
            rows="3"
            placeholder="此刻在想什么？"
            aria-describedby="char-counter"></textarea>

          <div class="composer__footer">
            <span class="composer__counter" id="char-counter" aria-live="polite">还可输入 140 字</span>
            <button type="submit" class="btn btn--primary" id="publish-btn" aria-busy="false" disabled>
              <span class="btn__spinner" aria-hidden="true"></span>
              <span id="publish-label">发布</span>
            </button>
          </div>
        </form>
      </section>

      <!-- 时间线 -->
      <section aria-label="片语时间线">
        <ul class="timeline" id="timeline" hidden></ul>

        <!-- 空状态：无片语时展示，与列表互斥 -->
        <div class="empty" id="empty-state">
          <svg class="empty__art" viewBox="0 0 160 120" fill="none" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="empty-page" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#EEF1FF" />
                <stop offset="1" stop-color="#FFFFFF" />
              </linearGradient>
            </defs>

            <!-- 信纸 -->
            <rect x="26" y="22" width="84" height="82" rx="12"
                  fill="url(#empty-page)" stroke="#E5E8EF" />
            <path d="M42 46h40M42 60h52M42 74h30" stroke="#C7D0E8" stroke-width="3"
                  stroke-linecap="round" />

            <!-- 虚线飞行轨迹 -->
            <path d="M78 96c14-6 26-16 32-28" stroke="#C7D0E8" stroke-width="2"
                  stroke-linecap="round" stroke-dasharray="1 7" />

            <!-- 纸飞机 -->
            <path d="M124 24l26-11-12 28-5-12-9-5z" fill="#EEF1FF" stroke="#3B5BFE"
                  stroke-width="2" stroke-linejoin="round" />
            <path d="M150 13l-17 16" stroke="#3B5BFE" stroke-width="2" stroke-linecap="round" />

            <!-- 点缀圆点 -->
            <circle cx="132" cy="74" r="3" fill="#C7D0E8" />
            <circle cx="146" cy="60" r="2" fill="#DDE3F2" />
          </svg>

          <p class="empty__title">还没有只言片语</p>
          <p class="empty__desc">写下此刻的一点点，它就会出现在这里。</p>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <p>内容仅保存在此浏览器 · 太子伴读</p>
    </footer>
  </div>

  <!-- 删除二次确认弹窗 -->
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal__backdrop" data-close="backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true"
         aria-labelledby="confirm-title" aria-describedby="confirm-desc">
      <h2 class="modal__title" id="confirm-title">删除这条片语？</h2>
      <p class="modal__desc" id="confirm-desc">删除后无法恢复，内容将从这台设备上移除。</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="cancel-delete">取消</button>
        <button type="button" class="btn btn--danger" id="confirm-delete">删除</button>
      </div>
    </div>
  </div>

  <!-- 轻提示：用于本地存储不可用等降级场景 -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (function () {
      'use strict';

      /* ================================================================
         一、常量与 DOM 引用
         ================================================================ */
      const STORAGE_KEY = 'taizi.feed.v1';   // 带版本号的键名，便于将来结构升级
      const STORAGE_VERSION = 1;
      const MAX_LENGTH = 140;                // 单条片语的字数上限
      const TIME_REFRESH_INTERVAL = 30 * 1000; // 相对时间的自动刷新间隔
      const PUBLISH_DELAY = 420;             // 模拟提交耗时，让加载态可被感知
      const WARN_THRESHOLD = 20;             // 剩余字数进入告警阈值

      const dom = {
        form: document.getElementById('composer-form'),
        input: document.getElementById('composer-input'),
        counter: document.getElementById('char-counter'),
        publishBtn: document.getElementById('publish-btn'),
        publishLabel: document.getElementById('publish-label'),
        timeline: document.getElementById('timeline'),
        emptyState: document.getElementById('empty-state'),
        modal: document.getElementById('confirm-modal'),
        cancelDeleteBtn: document.getElementById('cancel-delete'),
        confirmDeleteBtn: document.getElementById('confirm-delete'),
        toast: document.getElementById('toast'),
      };

      /* ================================================================
         二、状态
         posts 是唯一数据源，始终按 createdAt 倒序（新帖在前）维护
         ================================================================ */
      let posts = [];
      let pendingDeleteId = null;    // 等待用户确认删除的帖子 id
      let lastFocusedElement = null; // 打开弹窗前的焦点元素，关闭后归位

      let submitting = false;   // 发布请求进行中，用于防重复提交
      let wasOverLimit = false; // 上一次输入是否已超限，用于触发抖动动画
      let toastTimer = null;

      /* ================================================================
         三、存储层：与 localStorage 打交道，不触碰 DOM
         ================================================================ */

      /** 读取本地数据；任何异常都降级为空数组，绝不阻塞页面使用 */
      function loadPosts() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];

          const parsed = JSON.parse(raw);
          // 兼容两种历史形态：直接存数组，或存 { version, posts }
          const list = Array.isArray(parsed)
            ? parsed
            : (parsed && Array.isArray(parsed.posts) ? parsed.posts : []);

          return list
            .map(normalizePost)
            .filter(Boolean)
            .sort((a, b) => b.createdAt - a.createdAt);
        } catch (error) {
          console.warn('[太子伴读] 读取本地数据失败，已降级为本次会话内存态：', error);
          return [];
        }
      }

      /** 写入本地数据，返回是否成功（隐私模式 / 超出配额时会失败） */
      function savePosts() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ version: STORAGE_VERSION, posts: posts })
          );
          return true;
        } catch (error) {
          console.warn('[太子伴读] 保存到本地失败（可能处于隐私模式或存储已满）：', error);
          return false;
        }
      }

      /**
       * 校验并补齐单条数据，保证后续渲染逻辑拿到的字段一定合法
       * @param {any} raw 原始存储数据
       * @returns {{id:string, content:string, createdAt:number, author:object, stats:object}|null}
       */
      function normalizePost(raw) {
        if (!raw || typeof raw !== 'object') return null;

        const content = typeof raw.content === 'string' ? raw.content : '';
        if (!content.trim()) return null; // 丢弃空内容，避免时间线出现空白卡片

        const timestamp = Number(raw.createdAt);
        return {
          id: typeof raw.id === 'string' && raw.id ? raw.id : generateId(),
          content,
          createdAt: Number.isFinite(timestamp) && timestamp > 0 ? timestamp : Date.now(),
          // 以下字段为未来扩展预留（昵称、点赞、回复等），当前仅作展示兜底
          author: raw.author && typeof raw.author === 'object' ? raw.author : { name: '我' },
          stats: raw.stats && typeof raw.stats === 'object' ? raw.stats : { likes: 0, replies: 0 },
        };
      }

      /* ================================================================
         四、工具层：纯函数，无副作用
         ================================================================ */

      /** 生成唯一 id；优先使用原生 crypto，旧浏览器降级为时间戳 + 随机串 */
      function generateId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
      }

      /**
       * 按 Unicode 码点统计字数
       * 用 Array.from 而非 .length，可避免中文与 emoji 被算成多个字
       */
      function countChars(text) {
        return Array.from(text).length;
      }

      /**
       * 时间戳 → 相对时间文案
       * 刚刚 / N 分钟前 / N 小时前 / N 天前 / 具体日期
       */
      function formatRelativeTime(timestamp) {
        const diff = Date.now() - timestamp;
        if (diff < 0) return '刚刚'; // 本机时间回拨时兜底

        const MINUTE = 60 * 1000;
        const HOUR = 60 * MINUTE;
        const DAY = 24 * HOUR;

        if (diff < MINUTE) return '刚刚';
        if (diff < HOUR) return Math.floor(diff / MINUTE) + ' 分钟前';
        if (diff < DAY) return Math.floor(diff / HOUR) + ' 小时前';
        if (diff < 30 * DAY) return Math.floor(diff / DAY) + ' 天前';

        const date = new Date(timestamp);
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const sameYear = date.getFullYear() === new Date().getFullYear();
        return sameYear
          ? month + ' 月 ' + day + ' 日'
          : date.getFullYear() + ' 年 ' + month + ' 月 ' + day + ' 日';
      }

      /* ================================================================
         五、渲染层：只负责把数据变成 DOM
         ================================================================ */

      /**
       * 创建一条片语卡片
       * 关键：用户内容一律写入 textContent，绝不拼接进 innerHTML，从根源杜绝 XSS
       * @param {object} post
       * @returns {HTMLLIElement}
       */
      function createPostElement(post) {
        const item = document.createElement('li');
        item.className = 'post card';
        item.dataset.id = post.id;

        const avatar = document.createElement('span');
        avatar.className = 'avatar post__avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = (post.author && post.author.name ? post.author.name : '我').slice(0, 1) || '伴';

        const main = document.createElement('div');
        main.className = 'post__main';

        const head = document.createElement('div');
        head.className = 'post__head';

        const author = document.createElement('span');
        author.className = 'post__author';
        author.textContent = (post.author && post.author.name) || '我';

        const dot = document.createElement('span');
        dot.className = 'post__dot';
        dot.textContent = '·';

        const time = document.createElement('time');
        time.className = 'post__time';
        time.dateTime = new Date(post.createdAt).toISOString();
        time.dataset.time = String(post.createdAt); // 供定时刷新读取，避免遍历数据数组
        time.textContent = formatRelativeTime(post.createdAt);

        const body = document.createElement('p');
        body.className = 'post__body';
        body.textContent = post.content;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'icon-btn post__delete';
        removeBtn.dataset.action = 'delete';
        removeBtn.setAttribute('aria-label', '删除这条片语');
        removeBtn.title = '删除';
        // 固定不变的图标骨架才使用 innerHTML，字符串中不含任何用户数据
        removeBtn.innerHTML =
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" ' +
          'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M4 7h16"/>' +
          '<path d="M9.6 7V5.5c0-.8.65-1.5 1.45-1.5h1.9c.8 0 1.45.7 1.45 1.5V7"/>' +
          '<path d="M6.6 7l.8 11.2c.06.8.72 1.3 1.5 1.3h6.2c.78 0 1.44-.5 1.5-1.3L17.4 7"/>' +
          '<path d="M10.6 11v5M13.4 11v5"/></svg>';

        head.append(author, dot, time, removeBtn);
        main.append(head, body);
        item.append(avatar, main);
        return item;
      }

      /** 全量渲染：仅在首屏与数据整体变化时调用，用 DocumentFragment 减少回流 */
      function renderTimeline() {
        const fragment = document.createDocumentFragment();
        posts.forEach((post) => fragment.appendChild(createPostElement(post)));
        dom.timeline.replaceChildren(fragment);
      }

      /** 增量渲染：新帖直接插到列表顶部，保留输入焦点且不重建整列表 */
      function prependPost(post) {
        const element = createPostElement(post);
        // 仅新插入的卡片播放入场动画，首屏渲染时不会集体闪动
        element.classList.add('is-entering');
        element.addEventListener(
          'animationend',
          () => element.classList.remove('is-entering'),
          { once: true }
        );

        dom.timeline.prepend(element);
        syncEmptyState();
      }

      /** 移除一条卡片：先播放淡出，再摘除节点 */
      function removePostElement(postId) {
        const item = Array.from(dom.timeline.children).find((node) => node.dataset.id === postId);
        if (!item) {
          syncEmptyState();
          return;
        }

        let finalized = false;
        const finalize = () => {
          if (finalized) return;
          finalized = true;
          item.remove();
          syncEmptyState(); // 等节点真正移除后再切换空状态，避免打断淡出动画
        };

        item.classList.add('is-leaving');
        item.addEventListener('transitionend', finalize, { once: true });
        window.setTimeout(finalize, 260); // 兜底：动画被禁用时也能正常移除
      }

      /** 列表与空状态互斥切换 */
      function syncEmptyState() {
        const isEmpty = posts.length === 0;
        dom.timeline.hidden = isEmpty;
        dom.emptyState.hidden = !isEmpty;
      }

      /** 只更新已渲染卡片上的时间文案，不重建 DOM */
      function refreshTimes() {
        if (document.visibilityState === 'hidden') return; // 页面不可见时不做无用功
        dom.timeline.querySelectorAll('time[data-time]').forEach((node) => {
          const timestamp = Number(node.dataset.time);
          if (Number.isFinite(timestamp)) node.textContent = formatRelativeTime(timestamp);
        });
      }

      /* ================================================================
         六、交互层
         ================================================================ */

      /** 输入框随内容自动增高（上限由 CSS max-height 兜住） */
      function autoResizeInput() {
        dom.input.style.height = 'auto';
        dom.input.style.height = dom.input.scrollHeight + 'px';
      }

      /** 根据当前输入同步「剩余字数 + 发布按钮可用状态」 */
      function updateComposerState() {
        const value = dom.input.value;
        const remaining = MAX_LENGTH - countChars(value);
        const isOver = remaining < 0;

        dom.counter.textContent = isOver
          ? '已超出 ' + Math.abs(remaining) + ' 字'
          : '还可输入 ' + remaining + ' 字';
        dom.counter.dataset.state = isOver ? 'over' : (remaining <= WARN_THRESHOLD ? 'warn' : 'normal');

        // 刚跨过上限时抖动一次，给出"发不出去"的即时反馈
        if (isOver && !wasOverLimit) {
          dom.counter.classList.remove('is-shake');
          void dom.counter.offsetWidth; // 强制回流，让动画可重复触发
          dom.counter.classList.add('is-shake');
        }
        wasOverLimit = isOver;

        // 空内容、超出上限或正在提交时都禁止发布
        dom.publishBtn.disabled = submitting || isOver || value.trim() === '';

        autoResizeInput();
      }

      /** 切换发布按钮的加载态（同时锁定输入框，避免提交中被改写） */
      function setSubmitting(isSubmitting) {
        submitting = isSubmitting;
        dom.publishBtn.classList.toggle('is-loading', isSubmitting);
        dom.publishBtn.setAttribute('aria-busy', String(isSubmitting));
        dom.publishLabel.textContent = isSubmitting ? '发布中' : '发布';
        dom.input.readOnly = isSubmitting;
        updateComposerState();
      }

      /** 发布：校验 → 加载态 → 组装数据 → 落盘 → 渲染 → 复位输入框 */
      function handlePublish(event) {
        event.preventDefault();
        if (submitting) return;

        const content = dom.input.value.trim();
        if (!content || countChars(content) > MAX_LENGTH) return;

        setSubmitting(true);

        window.setTimeout(() => {
          const post = {
            id: generateId(),
            content,
            createdAt: Date.now(),
            author: { name: '我' },
            stats: { likes: 0, replies: 0 },
          };

          posts.unshift(post); // 新帖置于最前
          if (!savePosts()) {
            showToast('本地存储不可用，这条片语仅保留在当前页面');
          }
          prependPost(post);

          dom.input.value = '';
          setSubmitting(false);
          dom.input.focus();
        }, PUBLISH_DELAY);
      }

      /** 底部轻提示，2.6s 后自动消失 */
      function showToast(message) {
        dom.toast.textContent = message;
        dom.toast.hidden = false;
        void dom.toast.offsetWidth; // 确保过渡从初始态开始
        dom.toast.classList.add('is-visible');

        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          dom.toast.classList.remove('is-visible');
          window.setTimeout(() => { dom.toast.hidden = true; }, 240);
        }, 2600);
      }

      /* ---------------- 删除：二次确认 ---------------- */

      /** 点击删除入口：先记下待删 id，再请用户确认 */
      function requestDelete(postId) {
        pendingDeleteId = postId;
        openConfirmDialog();
      }

      function openConfirmDialog() {
        lastFocusedElement = document.activeElement;
        dom.modal.hidden = false;
        document.body.classList.add('is-modal-open'); // 锁定背景滚动
        dom.confirmDeleteBtn.focus();                 // 焦点移入弹窗，键盘可直接回车
      }

      function closeConfirmDialog() {
        if (dom.modal.hidden) return;

        dom.modal.hidden = true;
        document.body.classList.remove('is-modal-open');
        pendingDeleteId = null;

        // 焦点归位：原按钮仍在则回到按钮，已被移除则回到输入框
        if (lastFocusedElement && document.contains(lastFocusedElement)) {
          lastFocusedElement.focus();
        } else {
          dom.input.focus();
        }
        lastFocusedElement = null;
      }

      /** 用户确认删除：更新状态 → 落盘 → 淡出移除 */
      function confirmDelete() {
        const targetId = pendingDeleteId;
        if (!targetId) {
          closeConfirmDialog();
          return;
        }

        posts = posts.filter((post) => post.id !== targetId);
        if (!savePosts()) {
          showToast('本地存储不可用，本次删除仅在当前页面生效');
        }
        removePostElement(targetId);

        // 触发删除的按钮即将被移除，焦点直接回到输入框而非归还给按钮
        lastFocusedElement = null;
        closeConfirmDialog();
      }

      /** 时间线使用事件委托，避免为每张卡片单独绑定监听 */
      function handleTimelineClick(event) {
        const deleteBtn = event.target.closest('[data-action="delete"]');
        if (!deleteBtn) return;

        const item = deleteBtn.closest('.post');
        if (item && item.dataset.id) requestDelete(item.dataset.id);
      }

      /** 仅在点击遮罩自身时关闭，避免面板内拖拽误触关闭 */
      function handleModalPointerDown(event) {
        if (dom.modal.hidden) return;
        if (event.target === dom.modal || event.target.dataset.close === 'backdrop') {
          closeConfirmDialog();
        }
      }

      /** Esc 关闭弹窗，保证键盘可达性 */
      function handleGlobalKeydown(event) {
        if (event.key === 'Escape' && !dom.modal.hidden) closeConfirmDialog();
      }

      /** 其他标签页改动数据时重新加载，避免多标签之间数据错乱 */
      function handleStorageChange(event) {
        if (event.key !== STORAGE_KEY) return;
        posts = loadPosts();
        renderTimeline();
        syncEmptyState();
      }

      /** 从后台切回前台时立即校准相对时间 */
      function handleVisibilityChange() {
        if (document.visibilityState === 'visible') refreshTimes();
      }

      /* ================================================================
         七、初始化
         ================================================================ */
      function init() {
        posts = loadPosts();
        renderTimeline();
        syncEmptyState();
        updateComposerState();

        dom.input.addEventListener('input', updateComposerState);
        dom.form.addEventListener('submit', handlePublish);

        dom.timeline.addEventListener('click', handleTimelineClick);
        dom.cancelDeleteBtn.addEventListener('click', closeConfirmDialog);
        dom.confirmDeleteBtn.addEventListener('click', confirmDelete);
        dom.modal.addEventListener('mousedown', handleModalPointerDown);
        document.addEventListener('keydown', handleGlobalKeydown);

        window.addEventListener('storage', handleStorageChange);
        document.addEventListener('visibilitychange', handleVisibilityChange);

        window.setInterval(refreshTimes, TIME_REFRESH_INTERVAL);
      }

      init();
    })();
  </script>
</body>
</html>
